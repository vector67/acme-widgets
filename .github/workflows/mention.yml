name: mention
on:
  pull_request:
    types: [opened]
permissions:
  pull-requests: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR" --repo "$REPO" --body "@vector67 is an hour too long for the price cache?"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
